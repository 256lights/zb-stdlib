name: Build
on:
  push:
  pull_request:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install zb
        uses: 256lights/setup-zb@9197551755e735033ea2ae1a4bfac03d804c7028
        with:
          zb-version: '0.2.0-beta1'
      - name: Check zb version
        run: zb --version
