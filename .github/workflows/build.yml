name: Build
on:
  push:
  pull_request:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install zb
        uses: 256lights/setup-zb@v1
        with:
          zb-version: '0.2.0-beta1'
      - name: Build gcc
        run: zb build 'packages/gcc/gcc.lua#bootstrap'
